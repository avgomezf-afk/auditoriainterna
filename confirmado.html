<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirmación de correo · Auditoría SGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F5F2EA; --surface:#FFFFFF; --surface-2:#FAF8F1;
  --ink:#1B211F; --ink-2:#4B534E; --ink-3:#7C837B;
  --line:#DCD5C4; --line-2:#EBE6D9;
  --accent:#2C4A6E; --accent-2:#3D6796; --accent-soft:#E7ECF3; --on-accent:#FFFFFF;
  --ok:#3D7A55; --ok-bg:#E6EFE9; --ok-line:#B9D3C3;
  --warn:#A9791E; --warn-bg:#F6EEDC; --warn-line:#E0CB9B;
  --bad:#A03A34; --bad-bg:#F6E7E5; --bad-line:#E2BDB9;
  --shadow:0 1px 2px rgba(27,33,31,.06), 0 4px 14px rgba(27,33,31,.05);
  --radius:6px;
  --font-d:"Libre Franklin","Segoe UI",system-ui,sans-serif;
  --font-b:"Source Serif 4",Georgia,serif;
  --font-m:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-d);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:100%;max-width:470px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:30px 32px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line-2)}
.seal{width:34px;height:34px;border-radius:4px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.06em;font-family:var(--font-m);flex:none}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-family:var(--font-m);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-top:1px}
h1{margin:0 0 9px;font-size:21px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 12px;font-family:var(--font-b);font-size:14.5px;line-height:1.6;color:var(--ink-2)}
p:last-of-type{margin-bottom:0}
.correo{font-family:var(--font-m);font-size:13px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:4px;padding:2px 7px;display:inline-block;word-break:break-all}
.estado{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.punto{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;flex:none}
.punto.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.punto.mal{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.punto.esp{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.punto.carga{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}
.eti{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.acciones{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2)}
.btn{font-family:var(--font-d);font-size:13px;font-weight:600;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);padding:9px 16px;border-radius:5px;cursor:pointer;
  text-decoration:none;display:inline-block;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aviso{margin-top:16px;border-radius:5px;padding:10px 13px;font-size:13px;line-height:1.5}
.aviso.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.aviso.mal{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}
.pie{text-align:center;font-family:var(--font-m);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-top:18px}
.reenvio{margin-top:16px;display:none;gap:8px;flex-wrap:wrap}
.reenvio input{flex:1 1 200px;font-family:var(--font-d);font-size:13px;padding:9px 11px;
  border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.formPass{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.formPass input{font-family:var(--font-d);font-size:13px;padding:9px 11px;
  border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
@keyframes giro{to{transform:rotate(360deg)}}
.girando{animation:giro 1s linear infinite}
@media (prefers-reduced-motion:reduce){.girando{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <span class="seal">SGI</span>
      <span><b>Auditoría SGI</b><span>Auditorías internas</span></span>
    </div>

    <div class="estado">
      <div class="punto carga" id="punto"><span class="girando">◌</span></div>
      <div><div class="eti" id="eti">Verificando</div><h1 id="titulo">Confirmando su correo…</h1></div>
    </div>

    <div id="cuerpo">
      <p>Un momento, estamos validando el enlace del mensaje.</p>
    </div>

    <div class="reenvio" id="reenvio">
      <input type="email" id="correoReenvio" placeholder="su.correo@empresa.com" autocomplete="email">
      <button class="btn" id="btnReenviar">Reenviar enlace</button>
    </div>
    <div id="aviso"></div>

    <div class="acciones" id="acciones"></div>
  </div>
  <div class="pie">Sistema de auditorías internas</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://tdebfjzatrzbeygtjaqw.supabase.co";
const SUPABASE_KEY = "sb_publishable___DmVRyHiiN3jRx4HoT53Q_cwJTfNnU";

/* La app vive junto a esta página; se resuelve relativo para que funcione igual
   en GitHub Pages, en un servidor local o en cualquier subcarpeta. */
const URL_APP = new URL("index.html", location.href).href;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"pkce" }
});

const $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function pintar(tipo, eti, titulo, cuerpoHTML, botones){
  const iconos = {ok:"✓", mal:"!", esp:"⧗"};
  $("#punto").className = "punto "+tipo;
  $("#punto").textContent = iconos[tipo] || "◌";
  $("#eti").textContent = eti;
  $("#titulo").textContent = titulo;
  $("#cuerpo").innerHTML = cuerpoHTML;
  $("#acciones").innerHTML = botones || "";
}
function aviso(txt, tipo){
  $("#aviso").innerHTML = '<div class="aviso '+(tipo||"ok")+'">'+esc(txt)+'</div>';
}
const botonApp = '<a class="btn pri" href="'+URL_APP+'">Ir a la aplicación</a>';

/* Los enlaces de Supabase llegan de dos formas: con los datos en el fragmento
   (#access_token=… o #error=…) o con ?code=… cuando el proyecto usa PKCE.      */
function parametros(){
  const h = new URLSearchParams((location.hash||"").replace(/^#/,""));
  const q = new URLSearchParams(location.search||"");
  const leer = function(k){ return h.get(k) || q.get(k); };
  return {
    error: leer("error"),
    errorCode: leer("error_code"),
    descripcion: leer("error_description"),
    tipo: leer("type"),
    code: q.get("code")
  };
}

function ofrecerReenvio(correo){
  $("#reenvio").style.display = "flex";
  if(correo) $("#correoReenvio").value = correo;
}

function pintarRecuperacion(){
  pintar("esp","Restablecer contraseña","Escriba su contraseña nueva",
    '<p>Ingrese una contraseña nueva para su cuenta.</p>'+
    '<div class="formPass">'+
      '<input type="password" id="passNueva" placeholder="Contraseña nueva (mínimo 8 caracteres)" autocomplete="new-password">'+
      '<input type="password" id="passNueva2" placeholder="Repita la contraseña" autocomplete="new-password">'+
      '<button class="btn pri" id="btnGuardarPass" type="button">Guardar contraseña nueva</button>'+
    '</div>');
  $("#btnGuardarPass").onclick = async function(){
    const p1 = $("#passNueva").value, p2 = $("#passNueva2").value;
    if(p1.length < 8) return aviso("La contraseña debe tener al menos 8 caracteres.","mal");
    if(p1 !== p2) return aviso("Las contraseñas no coinciden.","mal");
    this.disabled = true; this.textContent = "Guardando…";
    const {error} = await sb.auth.updateUser({password:p1});
    this.disabled = false; this.textContent = "Guardar contraseña nueva";
    if(error) return aviso("No se pudo actualizar la contraseña: "+error.message,"mal");
    history.replaceState(null,"",location.pathname);
    pintar("ok","Contraseña actualizada","Ya puede ingresar con su contraseña nueva",
      '<p>Su contraseña se actualizó correctamente.</p>', botonApp);
  };
}

$("#btnReenviar").onclick = async function(){
  const correo = $("#correoReenvio").value.trim();
  if(correo.indexOf("@") < 1){ aviso("Escriba un correo electrónico válido.","mal"); return; }
  this.disabled = true; this.textContent = "Enviando…";
  try{
    const {error} = await sb.auth.resend({
      type:"signup", email:correo,
      options:{ emailRedirectTo: location.origin + location.pathname }
    });
    if(error) throw error;
    aviso("Le enviamos un enlace nuevo a "+correo+". Revise su bandeja de entrada y la carpeta de correo no deseado.","ok");
  }catch(e){
    aviso("No se pudo reenviar el enlace: "+e.message, "mal");
  }
  this.disabled = false; this.textContent = "Reenviar enlace";
};

(async function(){
  const p = parametros();

  if(p.error){
    const vencido = (p.errorCode==="otp_expired") || /expired/i.test(p.descripcion||"");
    pintar("mal","No se pudo confirmar",
      vencido ? "El enlace ya venció" : "El enlace no es válido",
      vencido
        ? '<p>Los enlaces de confirmación caducan por seguridad. Escriba su correo y le enviamos uno nuevo.</p>'
        : '<p>'+esc(p.descripcion || "El enlace del mensaje no se pudo procesar.")+'</p>'+
          '<p>Puede pedir uno nuevo con su correo electrónico.</p>',
      botonApp);
    ofrecerReenvio("");
    return;
  }

  /* detectSessionInUrl procesa el enlace solo; si el proyecto usa PKCE y el
     intercambio no ocurrió, se hace aquí de forma explícita. */
  let sesion = null;
  try{
    const {data} = await sb.auth.getSession();
    sesion = data ? data.session : null;
    if(!sesion && p.code){
      const {data:d2, error:e2} = await sb.auth.exchangeCodeForSession(p.code);
      if(e2) throw e2;
      sesion = d2 ? d2.session : null;
    }
  }catch(e){
    pintar("mal","No se pudo confirmar","El enlace no se pudo procesar",
      '<p>'+esc(e.message)+'</p><p>Solicite un enlace nuevo con su correo electrónico.</p>', botonApp);
    ofrecerReenvio("");
    return;
  }

  if(p.tipo === "recovery"){
    if(sesion && sesion.user){
      pintarRecuperacion();
    }else{
      pintar("mal","No se pudo confirmar","El enlace no es válido",
        '<p>No pudimos validar el enlace de recuperación. Solicítelo de nuevo desde la aplicación.</p>', botonApp);
    }
    return;
  }

  if(sesion && sesion.user){
    const correo = sesion.user.email || "";
    // limpia el token de la barra de direcciones
    history.replaceState(null,"",location.pathname);
    pintar("ok","Correo confirmado","Su cuenta quedó activada",
      '<p>Confirmamos <span class="correo">'+esc(correo)+'</span>. Ya puede ingresar al sistema de auditorías.</p>'+
      '<p>Si es la primera vez que entra, el administrador debe asignarle el rol y activar su acceso antes de que pueda registrar hallazgos.</p>',
      botonApp);
    return;
  }

  pintar("esp","Sin datos que confirmar","Abra el enlace desde su correo",
    '<p>Esta página confirma la dirección de correo de una cuenta nueva. Se llega a ella desde el enlace del mensaje que le enviamos al registrarse.</p>'+
    '<p>Si ya confirmó su cuenta, entre directamente a la aplicación. Si el enlace venció, pida uno nuevo aquí.</p>',
    botonApp);
  ofrecerReenvio("");
})();
</script>
</body>
</html>
